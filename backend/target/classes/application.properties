server.port=8085
spring.application.name=pointage-backend

spring.datasource.url=jdbc:mysql://localhost:3306/online_days?useSSL=false&serverTimezone=Africa/Tunis&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Tunis

# JWT config
app.jwt.secret=veryLongSecretKeyForJwtGenerationThatShouldBeChangedInProduction1234567890
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# Report deadline (Africa/Tunis)
app.report.deadline=18:00

spring.jackson.time-zone=Africa/Tunis

logging.level.org.springframework.security=INFO

# Excel files path
app.db-path=../db

# Folder where Excel reports uploaded from the frontend are stored (only these are parsed)
app.upload-path=../uploads

# Multipart upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
